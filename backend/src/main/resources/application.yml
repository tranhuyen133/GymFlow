server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: gymflow
  datasource:
    # Docker Compose truyền SPRING_DATASOURCE_URL/USERNAME/PASSWORD (giống repo nhóm); giá trị dưới cho chạy local
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/gymflow?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Ho_Chi_Minh}
    username: ${SPRING_DATASOURCE_USERNAME:gymflow}
    password: ${SPRING_DATASOURCE_PASSWORD:gymflow_dev_password}
    hikari:
      # InnoDB mặc định REPEATABLE READ: sau khi chờ khoá dòng, câu kiểm tra trùng vẫn đọc ảnh chụp cũ.
      # READ COMMITTED (như PostgreSQL) để mỗi câu lệnh thấy dữ liệu vừa commit.
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # Lược đồ do Flyway quản lý (db/migration)
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    # CSDL VPS đã có V4–V7 của bản demo cũ: bỏ qua migration đã chạy mà code không có, không coi là lỗi.
    ignore-migration-patterns: "*:missing,*:future"
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  jwt:
    secret: ${JWT_SECRET:change-me-please-use-at-least-32-characters-long}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}
  # Mặc định TẮT (an toàn cho production). Máy local bật bằng SEED_DEMO_DATA=true trong .env
  seed-demo-data: ${SEED_DEMO_DATA:false}
  demo:
    # Hiện nút đăng nhập nhanh bằng tài khoản demo (chỉ các tài khoản thật sự tồn tại). Mặc định tắt.
    quick-login: ${DEMO_QUICK_LOGIN:false}
  registration:
    enabled: ${REGISTRATION_ENABLED:true}
  app-base-url: ${APP_BASE_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:no-reply@gymflow.local}
  email-otp:
    valid-minutes: ${EMAIL_OTP_VALID_MINUTES:10}
    max-attempts: ${EMAIL_OTP_MAX_ATTEMPTS:5}
    resend-cooldown-seconds: ${EMAIL_OTP_RESEND_COOLDOWN_SECONDS:60}
    max-sends-per-hour: ${EMAIL_OTP_MAX_SENDS_PER_HOUR:5}
  # Giới hạn đăng nhập / đăng ký / quên mật khẩu theo IP. Chỉ tắt khi chạy kiểm thử tải.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
  reset:
    valid-minutes: 30
  ai:
    provider: ${AI_PROVIDER:gemini}
    free-text-enabled: ${AI_FREE_TEXT_ENABLED:true}
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:15}
    max-input-chars: ${AI_MAX_INPUT_CHARS:500}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.gymflow: INFO
